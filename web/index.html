<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--KL:HEAD-START-->
<title>KitchenLens — Food Safety &amp; Hygiene Verification</title>
<meta name="description" content="View the kitchen-recorded hygiene and food packing details linked to your order seal.">
<meta name="theme-color" content="#176b4b">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>

:root {
  color-scheme: light;
  --bg: #f4f7f5;
  --surface: #ffffff;
  --ink: #172b24;
  --muted: #62736b;
  --line: #dce6e0;
  --brand: #176b4b;
  --brand-dark: #10543a;
  --brand-soft: #e8f4ed;
  --accent: #d6a33b;
  --ok: #18794e;
  --warn: #a85a12;
  --bad: #b42318;
  --shadow: 0 8px 28px rgba(23, 43, 36, .055);
  --font-display: Inter, "Segoe UI", system-ui, sans-serif;
  --font-body: Inter, "Segoe UI", system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  padding: 24px 16px 48px;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: clamp(1.55rem, 5vw, 2rem); line-height: 1.15; letter-spacing: -.035em; margin-bottom: 6px; }
h2 { font-size: 1.12rem; line-height: 1.3; letter-spacing: -.015em; margin-bottom: 0; }
h3 { font-size: .98rem; margin-bottom: 4px; }
p { margin-bottom: 0; }
a { color: var(--brand); font-weight: 650; text-underline-offset: 3px; overflow-wrap: anywhere; }
button, input, select { font: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #77b89a; outline-offset: 3px;
}
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.eyebrow { font-size: .72rem; letter-spacing: .105em; text-transform: uppercase; color: var(--muted); font-weight: 750; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(16px, 4vw, 24px); box-shadow: var(--shadow); min-width: 0; }
.demo { background: #fff7e5; border: 1px solid #f0d79a; color: #624715; border-radius: 12px; padding: 12px 14px; font-size: .9rem; }
.err { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.brandbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brandmark { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brandicon { width: 42px; height: 42px; border-radius: 13px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 1.2rem; font-weight: 800; flex: 0 0 auto; }
.brandname { font-weight: 800; letter-spacing: -.02em; }
.brandtag { font-size: .76rem; color: var(--muted); }
.status-pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 6px 10px; background: var(--brand-soft); color: var(--brand-dark); font-size: .78rem; font-weight: 750; white-space: nowrap; }
.status-pill::before { content: ""; width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
.reporthead { display: flex; flex-direction: column; gap: 18px; }
.kitchenrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.kitchen { min-width: 0; }
.kitchenmeta { color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
.sealcode { flex: 0 0 auto; border: 1px dashed #c4d6ca; background: #f7fbf8; border-radius: 12px; padding: 9px 12px; text-align: center; min-width: 92px; }
.sealcode .eyebrow { font-size: .64rem; }
.sealcode .mono { font-weight: 800; color: var(--brand-dark); font-size: .92rem; }
.reporttitle { display: flex; flex-direction: column; gap: 5px; }
.reporttitle p { color: var(--muted); max-width: 58ch; }
.orderfacts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfb; min-width: 0; }
.fact .label { color: var(--muted); font-size: .72rem; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
.fact .value { margin-top: 4px; font-size: .93rem; font-weight: 700; overflow-wrap: anywhere; }
.sectionhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.sectionhead p { color: var(--muted); font-size: .87rem; margin-top: 4px; }
.stamped { position: relative; }
.tstamp {
  position: absolute; top: 8px; left: 8px; z-index: 1; pointer-events: none;
  background: rgba(0, 0, 0, .66); color: #fff; border-radius: 6px; padding: 4px 8px;
  font: 700 .74rem/1.3 var(--font-mono); font-variant-numeric: tabular-nums;
}
.video { border-radius: 14px; overflow: hidden; background: #edf3ef; border: 1px solid var(--line); }
.video video, .clip video { display: block; width: 100%; max-height: 440px; object-fit: cover; background: #10231a; }
.placeholder { min-height: 150px; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); background: repeating-linear-gradient(135deg, #f3f8f4 0 18px, #eaf2ec 18px 36px); }
.clip figcaption { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 6px 14px; padding: 12px 14px; background: #fbfdfb; font-size: .85rem; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 15px; padding: 17px; background: var(--surface); min-width: 0; }
.stathead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stat .v { font-size: clamp(1.6rem, 5vw, 2.05rem); line-height: 1.15; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin: 12px 0 5px; }
.stat .l { color: var(--muted); font-size: .84rem; }
.stat .hint { color: var(--muted); font-size: .75rem; margin-top: 10px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.pill { display: inline-flex; border-radius: 7px; padding: 4px 8px; font-size: .72rem; font-weight: 800; background: #eef2ef; color: var(--muted); }
.pill.ok { background: #e7f5ec; color: var(--ok); }
.pill.warn { background: #fff1db; color: var(--warn); }
.pill.bad { background: #fdecea; color: var(--bad); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; }
.rail { position: relative; }
.rail::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child .rail::before { bottom: 50%; }
.dot { position: absolute; left: 5px; top: 19px; width: 14px; height: 14px; border-radius: 50%; background: var(--brand); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.dot.packed { background: var(--accent); }
.entry { padding: 10px 0 18px; min-width: 0; }
.entry button { appearance: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; padding: 0; background: transparent; color: inherit; border-radius: 8px; }
.entry .title { font-weight: 750; }
.entry .when { display: inline-block; font-family: var(--font-mono); font-size: .76rem; color: var(--muted); margin-top: 3px; }
.entry .act { color: var(--brand); font-size: .83rem; font-weight: 750; white-space: nowrap; }
.entry .det { margin-top: 7px; font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; }
.media { margin-top: 12px; }
.media img, .media video { width: 100%; max-width: 100%; max-height: 440px; border-radius: 12px; display: block; object-fit: contain; background: #f0f4f1; }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.media .placeholder { border-radius: 12px; min-height: 110px; }
.notice { background: #f5f8f6; border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: .84rem; color: var(--muted); }
.reportactions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 11px 15px; font-weight: 750; cursor: pointer; }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn:hover { filter: brightness(.97); }
.lookup { display: flex; flex-direction: column; gap: 9px; }
.lookup label { font-weight: 750; font-size: .86rem; }
.lookup select, .lookup input { font: inherit; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--line); background: #fbfdfb; color: var(--ink); width: 100%; }
.lookup button { font: inherit; font-weight: 750; padding: 12px 14px; border-radius: 10px; border: 0; cursor: pointer; background: var(--brand); color: #fff; }
.footer { color: var(--muted); font-size: .82rem; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
.footer strong { color: var(--ink); }
@media (max-width: 520px) {
  body { padding: 14px 12px 32px; }
  main { gap: 13px; }
  .kitchenrow { flex-direction: column; }
  .sealcode { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; }
  .orderfacts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats { gap: 9px; }
  .stat { padding: 13px; }
  .reportactions .btn { flex: 1 1 140px; }
}
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; padding: 0; color: #172b24; font-size: 10pt; }
  main { max-width: none; gap: 10px; }
  .card, .stat { box-shadow: none; break-inside: avoid; }
  .reportactions, .entry .act { display: none !important; }
  .media[hidden] { display: none !important; }
  a { color: inherit; }
  .clip video { max-height: 220px; }
}

</style>
<!--KL:HEAD-END-->
<script src="config.js"></script>
</head>
<body>
<!--KL:BODY-START-->
<main id="app" aria-live="polite">
  <p class="muted">Loading your order…</p>
</main>
<script>
(function () {
  "use strict";
  var CFG = window.KL_CONFIG || {};
  var HOUR = 3600000;
  var CATS = ["Vegetables", "Meat & Fish", "Dairy", "Spices", "Cooking oil", "Grains & Pulses"];

  function invKey(cat) { return "INV_" + cat.toUpperCase().replace(/[^A-Z]/g, "_"); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return /^https:\/\//.test(u || "") ? u : ""; }

  /* Order code from /o/CODE, ?c=CODE or #CODE */
  function readCode() {
    var q = new URLSearchParams(location.search).get("c");
    if (q) return q.toUpperCase();
    var m = location.pathname.match(/\/o\/([A-Za-z0-9]{4,16})\/?$/);
    if (m) return m[1].toUpperCase();
    var h = location.hash.replace("#", "");
    return h ? h.toUpperCase() : "";
  }

  /* Firestore REST values -> plain JS */
  function decode(v) {
    if (!v) return null;
    if ("stringValue" in v) return v.stringValue;
    if ("integerValue" in v) return Number(v.integerValue);
    if ("doubleValue" in v) return Number(v.doubleValue);
    if ("booleanValue" in v) return v.booleanValue;
    if ("nullValue" in v) return null;
    if ("timestampValue" in v) return Date.parse(v.timestampValue);
    if ("mapValue" in v) return decodeFields(v.mapValue.fields || {});
    if ("arrayValue" in v) return (v.arrayValue.values || []).map(decode);
    return null;
  }
  function decodeFields(f) { var o = {}; Object.keys(f).forEach(function (k) { o[k] = decode(f[k]); }); return o; }

  function fetchOrder(code) {
    var url = "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(CFG.projectId) +
      "/databases/(default)/documents/orders/" + encodeURIComponent(code) + "?key=" + encodeURIComponent(CFG.apiKey);
    return fetch(url).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("Server responded " + r.status);
      return r.json().then(function (d) { return decodeFields(d.fields || {}); });
    });
  }

  /* Platform + order number -> lookup key (same rule as the app's orderRefKey) */
  function refKey(platform, ref) {
    function clean(x) { return String(x || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
    return clean(platform) + "_" + clean(ref);
  }
  function fetchCodeByRef(platform, ref) {
    var url = "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(CFG.projectId) +
      "/databases/(default)/documents/orderRefs/" + encodeURIComponent(refKey(platform, ref)) + "?key=" + encodeURIComponent(CFG.apiKey);
    return fetch(url).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("Server responded " + r.status);
      return r.json().then(function (d) { return decodeFields(d.fields || {}).code || null; });
    });
  }

  /* Demo-mode seals carry the order inside the link: "z" + base64url(deflate-raw(json)) */
  function decodePayload(s) {
    if (!s || s.charAt(0) !== "z") return Promise.reject(new Error("format"));
    if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("browser"));
    var b = s.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    var bin = atob(b), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text().then(JSON.parse);
  }
  /* Media stored in the kitchen's free Cloudinary account; the QR carries only IDs */
  function cloudUrl(cl, id, video) {
    if (!cl || !id) return "";
    var base = "https://res.cloudinary.com/" + encodeURIComponent(cl) + (video ? "/video/upload/q_auto/" : "/image/upload/f_auto,q_auto,w_900/");
    return base + String(id).split("/").map(encodeURIComponent).join("/") + (video ? ".mp4" : "");
  }
  function fromOffline(p) {
    var packed = (p.pt || 0) * 60000, snap = {};
    (p.r || []).forEach(function (r, i) {
      var c = String(r[0] || ""), label, type;
      if (c === "U") { label = "Utensils cleaned"; type = "video"; }
      else if (c === "S") { label = "Staff hygiene check"; type = "video"; }
      else if (c === "P") { label = "Pest control service"; type = "photo"; }
      else { label = c.slice(1) + " received"; type = "photo"; }
      var urls = (r[3] || []).map(function (id) { return cloudUrl(p.cl, id, type === "video"); }).filter(Boolean);
      snap["r" + i] = { at: packed - (r[1] || 0) * 60000, label: label, mediaType: type, mediaUrl: urls[0] || "", mediaUrls: urls, details: { note: r[2] } };
    });
    return {
      offline: true, kitchenName: p.k, kitchenLocality: p.a, kitchenCity: "", fssai: p.f, gstin: p.g,
      platform: p.p, orderRef: p.o, packerName: p.n, foodType: p.ft === "C" ? "Cold" : "Hot",
      tempC: p.t, tempOk: !!p.tk, score: p.s, packedAtMillis: packed, clipUrl: cloudUrl(p.cl, p.c, true), snapshot: snap,
      clipRecordedAt: p.cr ? packed - p.cr * 1000 : packed,
      hasCloud: !!(p.cl && p.c)
    };
  }

  function demoOrder() {
    var now = Date.now();
    var p = now - 9 * 60000;
    function e(label, hoursBefore, type, details) {
      return { at: p - hoursBefore * HOUR, label: label, mediaType: type, mediaUrl: "", details: details };
    }
    var snap = {};
    snap[invKey("Vegetables")] = e("Vegetables received", 7.2, "photo", { category: "Vegetables", photoCount: "3", billDate: "today", billCount: "2", supplierGst: "registered", supplierType: "Local market" });
    snap[invKey("Meat & Fish")] = e("Meat & Fish received", 5.5, "photo", { category: "Meat & Fish", billDate: "today", supplierType: "Wholesaler" });
    snap[invKey("Spices")] = e("Spices received", 24 * 9, "photo", { category: "Spices", supplierType: "Wholesaler" });
    snap.UTENSILS = e("Utensils cleaned", 2.1, "video", { cleaningMedium: "Detergent, Hot water, Food-grade sanitiser", shift: "Afternoon" });
    snap.STAFF = e("Staff hygiene check", 2.6, "video", { checklist: "Hand-wash with soap, Cap / hairnet, Gloves, Clean apron", missing: "Mask, Nails trimmed", shift: "Afternoon" });
    snap.PEST = e("Pest control service", 24 * 14, "photo", { vendor: "SafeHome Pest Services", nextDueDate: "in 16 days" });
    return {
      demo: true, kitchenName: "Biryani Box", kitchenLocality: "HSR Layout", kitchenCity: "Bengaluru",
      fssai: "11223344556677", gstin: "29ABCDE1234F1ZW", platform: "Swiggy", orderRef: "158823344471", orderRefLast4: "4471", packerName: "Asha",
      foodType: "Hot", tempC: 71, tempOk: true, score: 90, packedAtMillis: p, clipUrl: "", snapshot: snap
    };
  }

  function beforePacking(at, packed) {
    var min = Math.round((packed - at) / 60000);
    if (min < 1) return "at packing";
    if (min < 60) return min + " min before packing";
    if (min < 48 * 60) return Math.round(min / 60) + " h before packing";
    return Math.round(min / 1440) + " days before packing";
  }
  function fmt(t) {
    return new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function detailLine(d) {
    d = d || {};
    var pc = Number(d.photoCount || 0), bc = Number(d.billCount || 0);
    return [
      pc > 1 && (pc + " photos"), d.billDate && ("bill dated " + d.billDate), bc > 1 && (bc + " bills"),
      d.supplierGst && "GST-registered supplier", d.supplierType, d.cleaningMedium, d.checklist,
      d.missing && ("not shown: " + d.missing), d.vendor && ("by " + d.vendor), d.nextDueDate && ("next due " + d.nextDueDate), d.note
    ].filter(Boolean).join(" · ");
  }
  /* Date-time stamp in Indian time, e.g. "18 Oct 2026, 07:42:10 pm IST" */
  function stampText(ms) {
    try {
      return new Date(ms).toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true
      }) + " IST";
    } catch (e) { return new Date(ms).toString(); }
  }
  /* Video with a running timestamp: recording start + playback position */
  function stampedVideo(url, startMs) {
    var start = Number(startMs) || 0;
    return '<div class="stamped" data-start="' + start + '">' +
      (start ? '<span class="tstamp">' + esc(stampText(start)) + "</span>" : "") +
      '<video src="' + esc(url) + '" controls muted playsinline preload="metadata"></video></div>';
  }
  function wireStamps(root) {
    root.querySelectorAll(".stamped").forEach(function (box) {
      if (box.dataset.wired) return;
      box.dataset.wired = "1";
      var start = Number(box.getAttribute("data-start")) || 0, v = box.querySelector("video"), t = box.querySelector(".tstamp");
      if (!start || !v || !t) return;
      v.addEventListener("timeupdate", function () { t.textContent = stampText(start + v.currentTime * 1000); });
    });
  }
  function clipStart(entry) {
    var d = entry.details || {};
    return Number(d.recordedAt) || entry.at || 0;
  }

  function tone(score) { return score >= 80 ? "ok" : score >= 50 ? "warn" : "bad"; }

  function mediaHtml(entry, demo, offline) {
    var url = safeUrl(entry.mediaUrl);
    var many = (entry.mediaUrls || []).map(safeUrl).filter(Boolean);
    if (entry.mediaType !== "video" && many.length > 1) {
      return '<div class="gallery">' + many.map(function (u, i) {
        return '<img src="' + esc(u) + '" alt="' + esc(entry.label) + " photo " + (i + 1) + '" loading="lazy">';
      }).join("") + "</div>";
    }
    if (!url && offline) return '<div class="placeholder">This ' + (entry.mediaType === "video" ? "clip" : "photo") + " is stored on the kitchen's phone. It appears here once the kitchen connects cloud storage.</div>";
    if (!url) return '<div class="placeholder">' + (demo ? "Sample: the kitchen's " + (entry.mediaType === "video" ? "clip" : "photo") + " appears here" : "Media unavailable") + "</div>";
    return entry.mediaType === "video"
      ? stampedVideo(url, clipStart(entry))
      : '<img src="' + esc(url) + '" alt="' + esc(entry.label) + '" loading="lazy">';
  }

  function render(o, code) {
    var app = document.getElementById("app");
    var snap = o.snapshot || {};
    var packed = o.packedAtMillis || 0;
    var rows = Object.keys(snap).map(function (k) { return snap[k]; })
      .filter(function (r) { return r && typeof r.at === "number" && r.label; });
    rows.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });

    var clipUrl = safeUrl(o.clipUrl);
    var clip = clipUrl
      ? stampedVideo(clipUrl, o.clipRecordedAt || packed)
      : '<div class="placeholder">' + (o.demo ? "Sample packing video preview. Actual customer reports show the recorded packing clip when available."
        : o.offline ? "The packing clip is saved on the kitchen device and will appear here when cloud media is available."
        : "A packing clip is not available for this report.") + "</div>";

    var tempTone = o.tempOk ? "ok" : "bad";
    var foodType = o.foodType === "Cold" ? "Cold food" : "Hot food";
    var tempNote = o.tempOk
      ? (o.foodType === "Cold" ? "At or below the 5°C cold-food guideline" : "At or above the FSSAI guideline of 65°C for hot food")
      : (o.foodType === "Cold" ? "Above the 5°C cold-food guideline" : "Below the FSSAI guideline of 65°C for hot food");
    var tempStatus = o.tempOk ? "Guideline met" : "Review recorded";
    var scoreValue = Number(o.score);
    if (!Number.isFinite(scoreValue)) scoreValue = 0;
    scoreValue = Math.max(0, Math.min(100, Math.round(scoreValue)));
    var scoreTone = tone(scoreValue);
    var scoreLabel = scoreValue >= 80 ? "Higher recorded indicators" : scoreValue >= 50 ? "Some checks need attention" : "Limited recorded indicators";
    var displayOrder = o.orderRefLast4 ? "•••• " + String(o.orderRefLast4).slice(-4)
      : o.orderRef ? "•••• " + String(o.orderRef).slice(-4) : "Not provided";
    var kitchenLocation = [o.kitchenLocality, o.kitchenCity].filter(Boolean).join(", ");
    var packedDate = packed ? fmt(packed) : "Not recorded";
    var packer = o.packerName || "Kitchen team";
    var timeline = rows.map(function (r, i) {
      return '<li><div class="rail"><span class="dot"></span></div><div class="entry">' +
        '<button type="button" aria-expanded="false" data-i="' + i + '">' +
        '<span><span class="title">' + esc(r.label) + '</span><br><span class="when">' + esc(beforePacking(r.at, packed)) + " · " + esc(fmt(r.at)) + "</span></span>" +
        '<span class="act">' + (r.mediaType === "video" ? "View clip +" : "View evidence +") + "</span></button>" +
        (detailLine(r.details) ? '<div class="det">' + esc(detailLine(r.details)) + "</div>" : "") +
        '<div class="media" hidden data-m="' + i + '"></div></div></li>';
    }).join("") +
      '<li><div class="rail"><span class="dot packed"></span></div><div class="entry">' +
      '<span class="title">Order packed and sealed</span><br><span class="when">' + esc(packedDate) + " · recorded by " + esc(packer) + "</span></div></li>";

    app.innerHTML =
      (o.demo ? '<div class="demo"><strong>Preview report</strong> — This is illustrative sample data, not a live order or verified inspection. Actual reports display the records saved by the kitchen.</div>' : "") +
      (o.offline && !o.hasCloud ? '<div class="demo">Some media is stored on the kitchen device and may not be visible until cloud storage is connected.</div>' : "") +
      '<section class="card reporthead">' +
        '<div class="brandbar"><div class="brandmark"><div class="brandicon" aria-hidden="true">K</div><div><div class="brandname">KitchenLens</div><div class="brandtag">Food Safety &amp; Hygiene Verification</div></div></div>' +
        '<span class="status-pill">Seal record</span></div>' +
        '<div class="kitchenrow"><div class="kitchen"><div class="eyebrow">Prepared by</div><h1>' + esc(o.kitchenName || "Kitchen team") + '</h1>' +
          '<div class="kitchenmeta">' + esc(kitchenLocation || "Location not provided") + '</div>' +
          (o.fssai ? '<div class="kitchenmeta">FSSAI licence: <span class="mono">' + esc(o.fssai) + "</span></div>" : "") +
          (o.gstin ? '<div class="kitchenmeta">GSTIN: <span class="mono">' + esc(o.gstin) + "</span></div>" : "") +
        '</div><div class="sealcode"><div><div class="eyebrow">Seal reference</div><div class="mono">' + esc(code) + '</div></div></div></div>' +
        '<div class="reporttitle"><div class="eyebrow">Your order, transparently packed</div><p>This report summarises the preparation and hygiene records the kitchen had logged when your order was packed.</p></div>' +
        '<div class="orderfacts">' +
          '<div class="fact"><div class="label">Order platform</div><div class="value">' + esc(o.platform || "Not recorded") + '</div></div>' +
          '<div class="fact"><div class="label">Order reference</div><div class="value mono">' + esc(displayOrder) + '</div></div>' +
          '<div class="fact"><div class="label">Food category</div><div class="value">' + esc(foodType) + '</div></div>' +
          '<div class="fact"><div class="label">Packed at</div><div class="value">' + esc(packedDate) + '</div></div>' +
          '<div class="fact"><div class="label">Packed by</div><div class="value">' + esc(packer) + '</div></div>' +
          '<div class="fact"><div class="label">Record status</div><div class="value">Kitchen-recorded</div></div>' +
        '</div>' +
      '</section>' +
      '<section class="card"><div class="sectionhead"><div><h2>Packing evidence</h2><p>Recorded video of the packing process, where available.</p></div><span class="pill">No audio</span></div>' +
        '<figure class="clip video" style="margin:0">' + clip +
          '<figcaption><span><strong>Packing clip</strong><br><span class="muted">Video is recorded without sound</span></span><span class="muted small">' + esc(o.platform || "Order") + ' · ' + esc(displayOrder) + '</span></figcaption></figure>' +
      '</section>' +
      '<section class="stats">' +
        '<div class="stat"><div class="stathead"><span class="eyebrow">Temperature at packing</span><span class="pill ' + tempTone + '">' + esc(tempStatus) + '</span></div>' +
          '<div class="v ' + tempTone + '">' + (Number.isFinite(Number(o.tempC)) ? esc(Number(o.tempC).toFixed(1).replace(/\.0$/, "")) + "°C" : "Not recorded") + '</div>' +
          '<div class="l">' + esc(tempNote) + '</div><div class="hint">Food type: ' + esc(foodType) + '. This is a recorded handling check, not a laboratory test.</div></div>' +
        '<div class="stat"><div class="stathead"><span class="eyebrow">Hygiene record score</span><span class="pill ' + scoreTone + '">' + esc(scoreLabel) + '</span></div>' +
          '<div class="v ' + scoreTone + '">' + esc(scoreValue) + '<span class="small muted"> / 100</span></div>' +
          '<div class="l">Kitchen process-record indicator at packing</div><div class="hint">This score reflects recorded checks and freshness of records; it is not a food-safety certification or a guarantee of the meal.</div></div>' +
      '</section>' +
      '<section class="card"><div class="sectionhead"><div><h2>Preparation & hygiene timeline</h2><p>Records shown in time order. Open an item to view its available evidence.</p></div></div>' +
        (rows.length ? '<ol class="timeline">' + timeline + '</ol>' : '<div class="notice">No earlier hygiene records were linked to this order at the time the report was created. Please contact the kitchen if you need clarification.</div>') +
      '</section>' +
      '<section class="card"><div class="sectionhead"><div><h2>Before you enjoy your meal</h2><p>A few quick checks to help you verify the package.</p></div></div>' +
        '<div class="notice">• Check that the bag seal is intact and the printed seal reference matches this report.<br>• Follow the storage and consumption instructions on the food label.<br>• If the seal is broken, the order details look incorrect, or you have a concern, contact the kitchen using the details below.</div>' +
      '</section>' +
      '<div class="reportactions"><button class="btn primary" type="button" id="print-report">Print / Save as PDF</button><button class="btn" type="button" id="back-top">Back to top</button></div>' +
      '<footer class="footer"><strong>About this report</strong><span>This page presents the kitchen’s own recorded preparation and packing process. It is provided for transparency and does not constitute independent inspection, laboratory testing, or regulatory certification.</span>' +
        (CFG.supportEmail ? '<span>Questions or concerns? <a href="mailto:' + esc(CFG.supportEmail) + '?subject=KitchenLens%20seal%20' + encodeURIComponent(code) + '">' + esc(CFG.supportEmail) + '</a> · Please quote seal reference <span class="mono">' + esc(code) + '</span>.</span>' : '') +
        '<span>Report generated for this seal reference: <span class="mono">' + esc(code) + '</span>.</span></footer>';

    app.querySelectorAll("button[data-i]").forEach(function (b) {
      b.addEventListener("click", function () {
        var i = b.getAttribute("data-i");
        var box = app.querySelector('[data-m="' + i + '"]');
        var open = box.hidden;
        if (open && !box.innerHTML) { box.innerHTML = mediaHtml(rows[i], o.demo, o.offline); wireStamps(box); }
        box.hidden = !open;
        b.setAttribute("aria-expanded", String(open));
        b.querySelector(".act").textContent = open ? "Hide evidence −" : (rows[i].mediaType === "video" ? "View clip +" : "View evidence +");
      });
    });
    wireStamps(app);
    var printButton = document.getElementById("print-report");
    if (printButton) printButton.addEventListener("click", function () { window.print(); });
    var topButton = document.getElementById("back-top");
    if (topButton) topButton.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
    document.title = (o.kitchenName || "Kitchen") + " · Food packing report · " + code;
  }

  function showError(msg, withLookup) {
    document.getElementById("app").innerHTML = '<div class="err"><h2>Seal not found</h2><p class="muted">' + esc(msg) + "</p></div>";
    if (withLookup) showLookup(true);
  }

  var PLATFORMS = ["Swiggy", "Zomato", "Ownly", "Toing", "Direct / Other"];
  /* Customers can find their order with the platform order number shown in their app */
  function showLookup(append) {
    var html = '<form class="err lookup" id="lookup"><h2>Find your order</h2>' +
      '<p class="muted small">Enter the order number shown in your Swiggy, Zomato or other app.</p>' +
      '<label for="lk-p">Ordered on</label><select id="lk-p">' +
      PLATFORMS.map(function (p) { return "<option>" + esc(p) + "</option>"; }).join("") + "</select>" +
      '<label for="lk-o">Order number</label><input id="lk-o" inputmode="text" autocomplete="off" required>' +
      '<button type="submit">Show how my food was packed</button><p class="muted small" id="lk-msg" aria-live="polite"></p></form>';
    var app = document.getElementById("app");
    if (append) app.insertAdjacentHTML("beforeend", html); else app.innerHTML = html;
    document.getElementById("lookup").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var p = document.getElementById("lk-p").value, ref = document.getElementById("lk-o").value.trim();
      var msg = document.getElementById("lk-msg");
      if (!ref) { msg.textContent = "Enter your order number."; return; }
      msg.textContent = "Looking up your order…";
      fetchCodeByRef(p, ref).then(function (c) {
        if (!c) { msg.textContent = "No seal found for " + p + " order " + ref + ". Check the number, or scan the QR on your bag."; return; }
        return fetchOrder(c).then(function (o) { if (o) render(o, c); else msg.textContent = "This order's seal could not be loaded."; });
      }).catch(function () { msg.textContent = "We could not reach the server. Check your internet connection and try again."; });
    });
  }

  var params = new URLSearchParams(location.search);
  var payload = params.get("d");
  var code = readCode();
  var configured = CFG.projectId && CFG.apiKey && CFG.projectId !== "kitchenlens-demo";

  if (payload) {
    decodePayload(payload).then(function (p) { render(fromOffline(p), code || "SEAL"); }).catch(function (e) {
      showError(e && e.message === "browser"
        ? "Your browser is too old to read this seal. Open the link in a recent version of Chrome or Safari."
        : "This seal's details could not be read. Ask the restaurant to reprint the seal.");
    });
    return;
  }
  if (code === "DEMO" || (!configured && code)) {
    render(demoOrder(), code === "DEMO" || !code ? "DEMO2026" : code);
    return;
  }
  if (!configured) { render(demoOrder(), "DEMO2026"); return; }

  var byRef = params.get("o");
  if (!code && byRef) {
    fetchCodeByRef(params.get("p") || "Swiggy", byRef).then(function (c) {
      if (!c) { showError("No seal found for order " + byRef + ".", true); return; }
      return fetchOrder(c).then(function (o) { if (o) render(o, c); else showError("This order's seal could not be loaded.", true); });
    }).catch(function () { showError("We could not load this order right now. Check your internet connection and try again."); });
    return;
  }
  if (!code) { showLookup(false); return; }
  fetchOrder(code).then(function (o) {
    if (!o) showError("No order matches code " + code + ". Check the code printed on the seal, or look up your order number below.", true);
    else render(o, code);
  }).catch(function () {
    showError("We could not load this order right now. Check your internet connection and scan again.");
  });
})();
</script>
<!--KL:BODY-END-->
</body>
</html>
