<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--KL:HEAD-START-->
<title>KitchenLens — Food Safety &amp; Hygiene Verification</title>
<meta name="description" content="View the kitchen-recorded hygiene and food packing details linked to your order seal.">
<meta name="theme-color" content="#176b4b">
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Speed: open connections to the data and photo servers while the page loads (no web fonts to wait for) -->
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firebasestorage.googleapis.com">
<link rel="preconnect" href="https://res.cloudinary.com">
<style>

:root {
  color-scheme: light;
  --bg: #f4f7f5;
  --surface: #ffffff;
  --ink: #172b24;
  --muted: #62736b;
  --line: #dce6e0;
  --brand: #176b4b;
  --brand-dark: #10543a;
  --brand-soft: #e8f4ed;
  --accent: #d6a33b;
  --ok: #18794e;
  --warn: #a85a12;
  --bad: #b42318;
  --shadow: 0 8px 28px rgba(23, 43, 36, .055);
  --font-display: Inter, "Segoe UI", system-ui, sans-serif;
  --font-body: Inter, "Segoe UI", system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  padding: 24px 16px 48px;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: clamp(1.55rem, 5vw, 2rem); line-height: 1.15; letter-spacing: -.035em; margin-bottom: 6px; }
h2 { font-size: 1.12rem; line-height: 1.3; letter-spacing: -.015em; margin-bottom: 0; }
h3 { font-size: .98rem; margin-bottom: 4px; }
p { margin-bottom: 0; }
a { color: var(--brand); font-weight: 650; text-underline-offset: 3px; overflow-wrap: anywhere; }
button, input, select { font: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #77b89a; outline-offset: 3px;
}
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.eyebrow { font-size: .72rem; letter-spacing: .105em; text-transform: uppercase; color: var(--muted); font-weight: 750; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(16px, 4vw, 24px); box-shadow: var(--shadow); min-width: 0; }
.demo { background: #fff7e5; border: 1px solid #f0d79a; color: #624715; border-radius: 12px; padding: 12px 14px; font-size: .9rem; }
.err { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.brandbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brandmark { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brandicon { width: 42px; height: 42px; border-radius: 13px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 1.2rem; font-weight: 800; flex: 0 0 auto; }
.brandname { font-weight: 800; letter-spacing: -.02em; }
.brandtag { font-size: .76rem; color: var(--muted); }
.status-pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 6px 10px; background: var(--brand-soft); color: var(--brand-dark); font-size: .78rem; font-weight: 750; white-space: nowrap; }
.status-pill::before { content: ""; width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
.rating-chip { display:flex; flex-direction:column; align-items:flex-end; gap:2px; border:1px solid #cfe3d7; border-radius:14px; padding:8px 12px; background:var(--brand-soft); text-align:right; flex:0 0 auto; color:inherit; text-decoration:none; max-width:56%; }
.rating-chip:hover { filter:brightness(.98); }
.rating-chip .rating-kicker { color:var(--muted); font-size:.62rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
.rating-chip .rating-row { display:flex; align-items:center; gap:6px; }
.rating-chip .rating-num { font-weight:850; font-size:1.3rem; line-height:1.1; color:var(--brand-dark); font-variant-numeric:tabular-nums; }
.rating-chip .rating-name { font-weight:800; font-size:.84rem; line-height:1.2; color:var(--brand-dark); }
.rating-chip .rating-sub { font-size:.72rem; font-weight:700; color:var(--muted); line-height:1.25; }
.rating-chip.pending { background:#fff7e5; border-color:#f0d79a; }
.rating-chip.pending .rating-name { color:#8a5b12; }
.rating-chip.review { background:#fff0ed; border-color:#f4c7c0; }
.rating-chip.review .rating-name { color:var(--bad); }
.rating-chip.legacy { background:#f3f5f4; border-color:var(--line); }
.rating-chip.legacy .rating-name { color:var(--muted); }
/* Star meter: the gold part covers stars/5 of the width */
.stars { --p: 0%; display:inline-block; font-size:1.05rem; line-height:1; letter-spacing:1px; white-space:nowrap;
  background:linear-gradient(90deg, #e3a21a var(--p), #cfd8d3 var(--p)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.stars.big { font-size:1.6rem; }
.kcard { display:flex; flex-direction:column; gap:12px; }
.krow { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.knum { font-size:2.1rem; font-weight:850; letter-spacing:-.04em; line-height:1; color:var(--brand-dark); font-variant-numeric:tabular-nums; }
.kword { font-weight:800; }
.kmetrics { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
.kmetric { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fbfdfb; font-size:.82rem; color:var(--muted); }
.kmetric strong { display:block; color:var(--ink); font-size:1.02rem; }
.verified { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 11px; background:#e7f5ec; color:var(--ok); font-weight:800; font-size:.8rem; }
.declared { margin-top:6px; font-size:.84rem; color:var(--muted); }
.declared strong { color:var(--ink); }
.fb { display:flex; flex-direction:column; gap:12px; }
.fbq { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
.fbq .opts { display:flex; gap:8px; }
.fbq button { appearance:none; border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px; font-weight:750; cursor:pointer; }
.fbq button[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
.score-sections { display:flex; flex-direction:column; gap:12px; }
.score-section { border:1px solid var(--line); border-radius:12px; padding:12px; }
.score-section summary { cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px; font-weight:750; list-style:none; }
.score-section summary::-webkit-details-marker { display:none; }
.score-section summary::after { content:"+"; color:var(--brand); font-size:1.1rem; }
.score-section[open] summary::after { content:"−"; }
.score-points { font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--brand-dark); font-weight:850; }
.score-bar { height:6px; background:#eaf0ec; border-radius:999px; overflow:hidden; margin:10px 0; }
.score-bar span { display:block; height:100%; background:var(--brand); border-radius:999px; }
.score-item { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:7px 0; border-top:1px solid #edf1ee; font-size:.83rem; }
.score-item .item-note { color:var(--muted); font-size:.76rem; grid-column:1 / -1; }
.score-total { display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:800; padding-top:12px; }
.rating-legend { display:flex; flex-direction:column; gap:7px; margin-top:10px; }
.rating-legend div { display:flex; justify-content:space-between; gap:12px; font-size:.82rem; }
.brandbar { align-items:flex-start; }
/* Phones: keep the rating badge at the top right, beside a smaller logo */
@media (max-width:520px) {
  .brandtag { display:none; }
  .brandicon { width:36px; height:36px; border-radius:11px; }
  .rating-chip { padding:6px 10px; max-width:62%; }
  .rating-chip .rating-kicker { font-size:.56rem; }
  .rating-chip .rating-num { font-size:1.12rem; }
  .stars { font-size:.92rem; }
  .kmetrics { grid-template-columns:1fr; }
}
@media print { .score-section { break-inside:avoid; } .score-section:not([open]) .score-item { display:grid; } }

.reporthead { display: flex; flex-direction: column; gap: 18px; }
.kitchenrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.kitchen { min-width: 0; }
.kitchenmeta { color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
.sealcode { flex: 0 0 auto; border: 1px dashed #c4d6ca; background: #f7fbf8; border-radius: 12px; padding: 9px 12px; text-align: center; min-width: 92px; }
.sealcode .eyebrow { font-size: .64rem; }
.sealcode .mono { font-weight: 800; color: var(--brand-dark); font-size: .92rem; }
.reporttitle { display: flex; flex-direction: column; gap: 5px; }
.reporttitle p { color: var(--muted); max-width: 58ch; }
.orderfacts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfb; min-width: 0; }
.fact .label { color: var(--muted); font-size: .72rem; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
.fact .value { margin-top: 4px; font-size: .93rem; font-weight: 700; overflow-wrap: anywhere; }
.sectionhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.sectionhead p { color: var(--muted); font-size: .87rem; margin-top: 4px; }
.stamped { position: relative; }
.tstamp {
  position: absolute; top: 8px; left: 8px; z-index: 1; pointer-events: none;
  background: rgba(0, 0, 0, .66); color: #fff; border-radius: 6px; padding: 4px 8px;
  font: 700 .74rem/1.3 var(--font-mono); font-variant-numeric: tabular-nums;
}
.video { border-radius: 14px; overflow: hidden; background: #edf3ef; border: 1px solid var(--line); }
.video video, .clip video { display: block; width: 100%; max-height: 440px; object-fit: cover; background: #10231a; }
.placeholder { min-height: 150px; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); background: repeating-linear-gradient(135deg, #f3f8f4 0 18px, #eaf2ec 18px 36px); }
.clip figcaption { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 6px 14px; padding: 12px 14px; background: #fbfdfb; font-size: .85rem; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 15px; padding: 17px; background: var(--surface); min-width: 0; }
.stathead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stat .v { font-size: clamp(1.6rem, 5vw, 2.05rem); line-height: 1.15; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin: 12px 0 5px; }
.stat .l { color: var(--muted); font-size: .84rem; }
.stat .hint { color: var(--muted); font-size: .75rem; margin-top: 10px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.pill { display: inline-flex; border-radius: 7px; padding: 4px 8px; font-size: .72rem; font-weight: 800; background: #eef2ef; color: var(--muted); }
.pill.ok { background: #e7f5ec; color: var(--ok); }
.pill.warn { background: #fff1db; color: var(--warn); }
.pill.bad { background: #fdecea; color: var(--bad); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; }
.rail { position: relative; }
.rail::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child .rail::before { bottom: 50%; }
.dot { position: absolute; left: 5px; top: 19px; width: 14px; height: 14px; border-radius: 50%; background: var(--brand); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
.dot.packed { background: var(--accent); }
.entry { padding: 10px 0 18px; min-width: 0; }
.entry > button { appearance: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; padding: 0; background: transparent; color: inherit; border-radius: 8px; }
.entry .title { font-weight: 750; }
.entry .when { display: inline-block; font-family: var(--font-mono); font-size: .76rem; color: var(--muted); margin-top: 3px; }
.entry .act { color: var(--brand); font-size: .83rem; font-weight: 750; white-space: nowrap; }
.entry .det { margin-top: 7px; font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; }
.media { margin-top: 12px; }
.media img, .media video { width: 100%; max-width: 100%; max-height: 440px; border-radius: 12px; display: block; object-fit: contain; background: #f0f4f1; }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
/* Always-visible photo thumbnails; tap to enlarge */
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.entry .thumb, .thumb {
  display: block; position: relative; width: 76px; height: 76px; padding: 0; border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; background: #edf3ef; cursor: zoom-in; flex: 0 0 auto;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .more {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(16, 35, 26, .62);
  color: #fff; font-weight: 800; font-size: .95rem;
}
.thumb:focus-visible { outline: 3px solid #77b89a; outline-offset: 2px; }
.thumbhint { font-size: .76rem; color: var(--muted); margin-top: 4px; }
.entry .gallery .thumb, .gallery .thumb { width: 100%; height: auto; aspect-ratio: 1 / 1; }

/* Full-screen photo viewer */
.lb {
  position: fixed; inset: 0; z-index: 100; background: #0b1410; color: #fff;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.lb[hidden] { display: none !important; }
.lb-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.lb-title { flex: 1; min-width: 0; font-weight: 700; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-count { font: 700 .82rem/1 var(--font-mono); opacity: .8; }
.lb-btn {
  background: rgba(255, 255, 255, .14); color: #fff; border: 0; border-radius: 999px; min-width: 44px; height: 44px;
  padding: 0 14px; font-size: 1rem; font-weight: 700; cursor: pointer; text-decoration: none;
  display: inline-grid; place-items: center;
}
.lb-btn:hover { background: rgba(255, 255, 255, .24); }
.lb-btn:focus-visible { outline: 3px solid #9fd6bb; outline-offset: 2px; }
.lb-stage { position: relative; flex: 1; overflow: hidden; touch-action: none; display: grid; place-items: center; }
.lb-stage img {
  max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none;
  transform-origin: center center; transition: transform .12s ease-out; cursor: zoom-in;
}
.lb-stage.zoomed img { cursor: grab; transition: none; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); }
.lb-prev { left: 8px; } .lb-next { right: 8px; }
.lb-foot { display: flex; justify-content: center; gap: 10px; padding: 10px 12px 14px; flex-wrap: wrap; }
.lb-tip { text-align: center; font-size: .78rem; opacity: .7; padding: 0 12px 6px; }
@media (prefers-reduced-motion: reduce) { .lb-stage img { transition: none; } }
.media .placeholder { border-radius: 12px; min-height: 110px; }
.notice { background: #f5f8f6; border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: .84rem; color: var(--muted); }
.reportactions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 11px 15px; font-weight: 750; cursor: pointer; }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn:hover { filter: brightness(.97); }
.lookup { display: flex; flex-direction: column; gap: 9px; }
.lookup label { font-weight: 750; font-size: .86rem; }
.lookup select, .lookup input { font: inherit; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--line); background: #fbfdfb; color: var(--ink); width: 100%; }
.lookup button { font: inherit; font-weight: 750; padding: 12px 14px; border-radius: 10px; border: 0; cursor: pointer; background: var(--brand); color: #fff; }
.footer { color: var(--muted); font-size: .82rem; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
.footer strong { color: var(--ink); }
@media (max-width: 520px) {
  body { padding: 14px 12px 32px; }
  main { gap: 13px; }
  .kitchenrow { flex-direction: column; }
  .sealcode { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; }
  .orderfacts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats { gap: 9px; }
  .stat { padding: 13px; }
  .reportactions .btn { flex: 1 1 140px; }
}
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; padding: 0; color: #172b24; font-size: 10pt; }
  main { max-width: none; gap: 10px; }
  .card, .stat { box-shadow: none; break-inside: avoid; }
  .reportactions, .entry .act { display: none !important; }
  .media[hidden] { display: none !important; }
  .lb, .thumbhint { display: none !important; }
  a { color: inherit; }
  .clip video { max-height: 220px; }
}

</style>
<!--KL:HEAD-END-->
<script src="config.js"></script>
</head>
<body>
<!--KL:BODY-START-->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lb-title">
  <div class="lb-bar">
    <span class="lb-title" id="lb-title"></span>
    <span class="lb-count" id="lb-count"></span>
    <button type="button" class="lb-btn" id="lb-close" aria-label="Close photo viewer">✕</button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <img id="lb-img" alt="">
    <button type="button" class="lb-btn lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
    <button type="button" class="lb-btn lb-nav lb-next" id="lb-next" aria-label="Next photo">›</button>
  </div>
  <div class="lb-tip">Pinch or double-tap to zoom · swipe for the next photo</div>
  <div class="lb-foot">
    <button type="button" class="lb-btn" id="lb-zoomout" aria-label="Zoom out">−</button>
    <button type="button" class="lb-btn" id="lb-zoomin" aria-label="Zoom in">+</button>
    <a class="lb-btn" id="lb-open" href="#" target="_blank" rel="noopener">Open original</a>
  </div>
</div>
<main id="app" aria-live="polite">
  <p class="muted">Loading your order…</p>
</main>
<script>
(function () {
  "use strict";
  var CFG = window.KL_CONFIG || {};
  var HOUR = 3600000;
  var CATS = ["Vegetables", "Meat & Fish", "Dairy", "Spices", "Cooking oil", "Grains & Pulses"];

  function invKey(cat) { return "INV_" + cat.toUpperCase().replace(/[^A-Z]/g, "_"); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  /* https links, plus the built-in sample photos on the demo report */
  function safeUrl(u) { return /^https:\/\//.test(u || "") || /^data:image\/svg\+xml;charset=utf-8,/.test(u || "") ? u : ""; }

  /* Sample photo for the demo report: coloured scene with a burned-in style timestamp */
  function samplePhoto(label, n, hue, at) {
    label = String(label).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    var stamp = "KitchenLens · " + stampText(at);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(' + hue + ',55%,62%)"/>' +
      '<stop offset="1" stop-color="hsl(' + (hue + 30) + ',50%,38%)"/></linearGradient></defs>' +
      '<rect width="1200" height="900" fill="url(#g)"/>' +
      '<g fill="rgba(255,255,255,.22)"><circle cx="300" cy="380" r="150"/><circle cx="620" cy="460" r="190"/><circle cx="930" cy="360" r="130"/></g>' +
      '<text x="600" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="64" font-weight="700" fill="#fff">' + label + '</text>' +
      '<text x="600" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" fill="#fff">Sample photo ' + n + '</text>' +
      '<rect y="842" width="1200" height="58" fill="rgba(0,0,0,.6)"/>' +
      '<text x="24" y="882" font-family="Courier New,monospace" font-size="30" font-weight="700" fill="#fff">' + stamp + '</text></svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  /* Order code from /o/CODE, ?c=CODE or #CODE */
  function readCode() {
    var q = new URLSearchParams(location.search).get("c");
    if (q) return q.toUpperCase();
    var m = location.pathname.match(/\/o\/([A-Za-z0-9]{4,16})\/?$/);
    if (m) return m[1].toUpperCase();
    var h = location.hash.replace("#", "");
    return h ? h.toUpperCase() : "";
  }

  /* Firestore REST values -> plain JS */
  function decode(v) {

        start = { pinch: dist(pts[ids[0]], pts[ids[1]]), scale: LB.scale };
      } else {
        start = { x: e.clientX, y: e.clientY, ox: LB.x, oy: LB.y, t: Date.now() };
        if (Date.now() - lastTap < 300) { lbZoom(LB.scale > 1 ? 1 : 2.5); lastTap = 0; } else lastTap = Date.now();
      }
    });
    stage.addEventListener("pointermove", function (e) {
      if (!pts[e.pointerId] || !start) return;
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pts);
      if (ids.length === 2 && start.pinch) {
        lbZoom(start.scale * dist(pts[ids[0]], pts[ids[1]]) / start.pinch);
      } else if (ids.length === 1 && LB.scale > 1 && start.ox !== undefined) {
        LB.x = start.ox + (e.clientX - start.x); LB.y = start.oy + (e.clientY - start.y); lbApply();
      }
    });
    function end(e) {
      if (!pts[e.pointerId]) return;
      var ids = Object.keys(pts);
      if (ids.length === 1 && start && start.ox !== undefined && LB.scale <= 1.01) {
        var dx = e.clientX - start.x, dy = e.clientY - start.y;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && Date.now() - start.t < 600) lbShow(LB.i + (dx < 0 ? 1 : -1));
      }
      delete pts[e.pointerId];
      start = Object.keys(pts).length ? start : null;
    }
    stage.addEventListener("pointerup", end);
    stage.addEventListener("pointercancel", end);
    img.addEventListener("dragstart", function (e) { e.preventDefault(); });
  }
  function wireThumbs(root, rows) {
    root.querySelectorAll("button.thumb").forEach(function (b) {
      if (b.dataset.wired) return;

        var ph = photoUrls(r);

  /* ---------- Hygiene rating display (same words as the apps) ---------- */
  function starsOf(pct) { return Math.round(Math.max(0, Math.min(100, pct)) / 10) / 2; }
  function ratingWord(pct) { return pct >= 90 ? "Excellent" : pct >= 80 ? "Very good" : pct >= 70 ? "Good" : pct >= 50 ? "Fair" : "Needs improvement"; }
  function starMeter(stars, big) {
    return '<span class="stars' + (big ? " big" : "") + '" style="--p:' + (stars / 5 * 100) + '%" role="img" aria-label="' +
      esc(stars) + ' out of 5 stars">★★★★★</span>';
  }
  function withheldText(foodType) { return foodType === "Cold" ? "Food above 5°C at packing" : "Food below 65°C at packing"; }
  /* "rated", "withheld", "incomplete" or "legacy" (seal issued before the rating system) */
  function ratingState(o) {
    var b = o.scoreBreakdown;
    if (!b || (typeof b === "object" && !Object.keys(b).length)) return "legacy";
    if (b.status === "rated" || b.status === "withheld" || b.status === "incomplete") return b.status;
    var complete = o.scoreComplete === true || b.complete === true;
    var gate = o.safetyGatePassed === true || b.safetyGatePassed === true;
    return !complete ? "incomplete" : !gate ? "withheld" : "rated";
  }
  function parseDay(v) {
    if (v == null || v === "") return 0;
    if (typeof v === "number") return v;
    var m = String(v).match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getTime();
    var t = Date.parse(v);
    return isNaN(t) ? 0 : t;
  }
  function dayText(t) { return new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); }

  function chipHtml(o, state, pct) {
    if (state === "rated") {
      var st = starsOf(pct);
      return '<a class="rating-chip" href="#breakdown" aria-label="Hygiene rating ' + st + ' out of 5, ' + esc(ratingWord(pct)) + '. See how it was worked out.">' +
        '<span class="rating-kicker">Hygiene rating</span>' +
        '<span class="rating-row"><span class="rating-num">' + st.toFixed(1) + '</span>' + starMeter(st) + '</span>' +
        '<span class="rating-name">' + esc(ratingWord(pct)) + '</span></a>';
    }
    var cls = state === "withheld" ? "review" : state === "incomplete" ? "pending" : "legacy";
    var name = state === "withheld" ? "Rating withheld" : "Not rated";
    var sub = state === "withheld" ? withheldText(o.foodType) : state === "incomplete" ? "Some hygiene records missing" : "Issued before the rating system";
    return '<a class="rating-chip ' + cls + '" href="' + (state === "legacy" ? "#about-rating" : "#breakdown") + '">' +
      '<span class="rating-kicker">Hygiene rating</span><span class="rating-name">' + esc(name) + '</span><span class="rating-sub">' + esc(sub) + '</span></a>';
  }

        ks.spotRequested ? '<div class="kmetric"><strong>' + esc(ks.spotAnswered || 0) + ' of ' + esc(ks.spotRequested) + '</strong>surprise spot checks answered within 30 minutes</div>' : "",
        ks.sealIntactPct != null ? '<div class="kmetric"><strong>' + esc(ks.sealIntactPct) + '%</strong>of customers found the seal intact (' + esc(ks.feedbackCount || 0) + ' answers)</div>' : "",

      ].join("");

        (ks.trend ? ' · ' + esc(ks.trend) : '') + '</span></span></div>' + (metrics ? '<div class="kmetrics">' + metrics + '</div>' : "");

  function wireFeedback(o, code) {
    var box = document.getElementById("fb");

    if (printButton) printButton.addEventListener("click", function () { window.print(); });
    var topButton = document.getElementById("back-top");
    if (topButton) topButton.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
    document.title = (o.kitchenName || "Kitchen") + " · Food packing report · " + code;
  }

  function showError(msg, withLookup) {
    document.getElementById("app").innerHTML = '<div class="err"><h2>Seal not found</h2><p class="muted">' + esc(msg) + "</p></div>";
    if (withLookup) showLookup(true);
  }

  var PLATFORMS = ["Swiggy", "Zomato", "Ownly", "Toing", "Direct / Other"];
  /* Customers can find their order with the platform order number shown in their app */
  function showLookup(append) {
    var html = '<form class="err lookup" id="lookup"><h2>Find your order</h2>' +
      '<p class="muted small">Enter the order number shown in your Swiggy, Zomato or other app.</p>' +
      '<label for="lk-p">Ordered on</label><select id="lk-p">' +
      PLATFORMS.map(function (p) { return "<option>" + esc(p) + "</option>"; }).join("") + "</select>" +
      '<label for="lk-o">Order number</label><input id="lk-o" inputmode="text" autocomplete="off" required>' +
      '<button type="submit">Show how my food was packed</button><p class="muted small" id="lk-msg" aria-live="polite"></p></form>';
    var app = document.getElementById("app");
    if (append) app.insertAdjacentHTML("beforeend", html); else app.innerHTML = html;
    document.getElementById("lookup").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var p = document.getElementById("lk-p").value, ref = document.getElementById("lk-o").value.trim();
      var msg = document.getElementById("lk-msg");
      if (!ref) { msg.textContent = "Enter your order number."; return; }
      msg.textContent = "Looking up your order…";
      fetchCodeByRef(p, ref).then(function (c) {
        if (!c) { msg.textContent = "No seal found for " + p + " order " + ref + ". Check the number, or scan the QR on your bag."; return; }
        return fetchOrder(c).then(function (o) { if (o) render(o, c); else msg.textContent = "This order's seal could not be loaded."; });
      }).catch(function () { msg.textContent = "We could not reach the server. Check your internet connection and try again."; });
    });
  }

  var params = new URLSearchParams(location.search);
  var payload = params.get("d");
  var code = readCode();
  var configured = CFG.projectId && CFG.apiKey && CFG.projectId !== "kitchenlens-demo";

  if (payload) {
    decodePayload(payload).then(function (p) { render(fromOffline(p), code || "SEAL"); }).catch(function (e) {
      showError(e && e.message === "browser"
        ? "Your browser is too old to read this seal. Open the link in a recent version of Chrome or Safari."
        : "This seal's details could not be read. Ask the restaurant to reprint the seal.");
    });
    return;
  }
  if (code === "DEMO" || (!configured && code)) {
    render(demoVariant(demoOrder(), params.get("s")), code === "DEMO" || !code ? "DEMO2026" : code);
    return;
  }
  if (!configured) { render(demoOrder(), "DEMO2026"); return; }

  var byRef = params.get("o");
  if (!code && byRef) {
    fetchCodeByRef(params.get("p") || "Swiggy", byRef).then(function (c) {
      if (!c) { showError("No seal found for order " + byRef + ".", true); return; }
      return fetchOrder(c).then(function (o) { if (o) render(o, c); else showError("This order's seal could not be loaded.", true); });
    }).catch(function () { showError("We could not load this order right now. Check your internet connection and try again."); });
    return;
  }
  if (!code) { showLookup(false); return; }
  fetchOrder(code).then(function (o) {
    if (!o) showError("No order matches code " + code + ". Check the code printed on the seal, or look up your order number below.", true);
    else render(o, code);
  }).catch(function () {
    showError("We could not load this order right now. Check your internet connection and scan again.");
  });
})();
</script>
